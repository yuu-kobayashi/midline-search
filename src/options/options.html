<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title data-i18n="settings_title"></title>
		<link rel="stylesheet" href="options.css" />
		<link rel="icon" type="image/png" href="../icons/icon-32.png" />
	</head>
	<body>
		<div class="header">
			<div class="header-inner">
				<div class="header-logo">
					<img src="../icons/midline-search_icon_white.png" alt="" />
					<h1 data-i18n="ext_name"></h1>
				</div>
				<div class="header-menu">
					<a href="https://github.com/yuu-kobayashi/midline-search/blob/main/CHANGELOG.md" target="_blank" data-i18n="changelog"></a>
					<a href="https://github.com/yuu-kobayashi/midline-search/issues/new?template=bug_report.md" target="_blank" data-i18n="report_bug"></a>
					<a href="https://buymeacoffee.com/ykoba" target="_blank" data-i18n="send_tip"></a>
				</div>
			</div>
		</div>
		<div class="description">
			<p data-i18n="settings_desc"></p>
			<p data-i18n="settings_desc2"></p>
		</div>
		<div class="container">
			<div class="tab-list" id="settings-tabs" role="tablist"></div>
			<div id="settings-panels"></div>
		</div>

		<div class="footer">
			<small> Created by <a href="https://yusukeweb.work/" target="_blank">Yusuke Kobayashi</a> </small>
		</div>

		<!-- Reset confirmation modal -->
		<div id="reset-modal" class="modal">
			<div class="modal-content">
				<h2 class="modal-title" data-i18n="reset_confirmation"></h2>
				<p class="modal-message" data-i18n="reset_confirmation_message"></p>
				<div class="modal-buttons">
					<button class="modal-button cancel" id="cancel-reset" data-i18n="cancel"></button>
					<button class="modal-button confirm" id="confirm-reset" data-i18n="reset"></button>
				</div>
			</div>
		</div>

		<script src="../utils/settings.js"></script>
		<script src="../utils/search-tabs.js"></script>
		<script src="../utils/i18n-helper.js"></script>
		<script src="options.js"></script>
	</body>
</html>
