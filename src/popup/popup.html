<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<div class="container">
			<div class="title" data-i18n="ext_name"></div>
			<div class="ui-wrapper">
				<div class="toggle-container">
					<label class="switch">
						<input type="checkbox" id="css-toggle" checked />
						<span class="slider round"></span>
					</label>
				</div>
				<div class="menu-container">
					<button type="button" id="menu-icon" aria-label="setting">
						<img src="../icons/menu-icon.svg" alt="" class="menu-icon" />
					</button>
				</div>
			</div>
		</div>
		<script src="../utils/settings.js"></script>
		<script src="../utils/i18n-helper.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
